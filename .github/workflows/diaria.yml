# Rodada diária: as séries oficiais (Banco Central, Tesouro) e o boletim Focus, duas vezes por dia.
# Cada série passa pelo portão (estudo/portao.py): número estranho não entra, fica o de antes, com a data de antes, e
# abre um aviso nas Issues. Só publica a função analyze do Supabase quando algum dado mudou e os testes do Python e do
# TypeScript passaram. Evento novo (Copom, turno, pesquisa) não entra aqui: só por pull request.
#
# Uma vez só, em Settings › Secrets and variables › Actions › New repository secret:
#   SUPABASE_ACCESS_TOKEN   token de quem administra o projeto Thoran no Supabase
#                           (supabase.com/dashboard/account/tokens). Sem ele a rodada roda, guarda o dado e não publica.
name: Rodada diária

on:
  schedule:
    - cron: '47 10 * * *'  # 07:47 em Brasília: o Tesouro e o Focus publicados de madrugada
    - cron: '23 0 * * *'   # 21:23 em Brasília: a PTAX do dia e, em dia de Copom, a decisão
  workflow_dispatch:
    inputs:
      aceitar:
        description: 'Séries cujo salto você conferiu na fonte e libera (ex.: ptax,ibov)'
        required: false
        default: ''

# Um por vez com o Publicar. O GitHub guarda só uma rodada esperando por grupo: se outra chega, a que esperava é
# cancelada (sem aviso), e o dado entra na rodada seguinte.
concurrency:
  group: analyze-thoran
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rodada:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Baixar e passar pelo portão
        env:
          ACEITAR: ${{ inputs.aceitar }}
          RELATORIO: ${{ runner.temp }}/relatorio.md
          AVISO: ${{ runner.temp }}/aviso.md
        run: python -m estudo diario

      - name: Algum dado mudou?
        id: mudou
        run: |
          if git status --porcelain -- dados/series | grep -q .; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "sim=0" >> "$GITHUB_OUTPUT"; fi

      - name: Exportar a base e testar
        if: steps.mudou.outputs.sim == '1'
        run: |
          python -m agente.exportar
          python -m pytest -q --ignore=tests/test_navegador.py
          deno test --allow-read --allow-env supabase/functions/_shared/agente/

      - name: Publicar a analyze no Supabase
        if: steps.mudou.outputs.sim == '1' && env.SUPABASE_ACCESS_TOKEN != ''
        run: npx -y supabase@2.120.0 functions deploy analyze --project-ref ainbuvumkglumwodvdok --no-verify-jwt --use-api

      - name: Guardar o dado do dia
        if: steps.mudou.outputs.sim == '1'
        run: |
          git config user.name 'rodada-diaria[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/series supabase/functions/_shared/base.json tests/dados
          publicado=$([ -n "$SUPABASE_ACCESS_TOKEN" ] && echo 'publicado no Supabase' || echo 'NÃO publicado: falta o SUPABASE_ACCESS_TOKEN')
          git commit -m "Rodada diária de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') ($publicado)" -m "$(cat "$RUNNER_TEMP/relatorio.md")"
          git pull --rebase
          git push

      - name: Avisar série segurada
        run: |
          [ -s "$RUNNER_TEMP/aviso.md" ] || exit 0
          gh label create rodada-segurada --color FBCA04 --description 'O portão segurou uma série' --force >/dev/null
          n=$(gh issue list --label rodada-segurada --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/aviso.md"
          else gh issue create --title 'Rodada diária: série segurada' --label rodada-segurada --body-file "$RUNNER_TEMP/aviso.md"; fi

      - name: Avisar que falhou
        if: failure()
        run: |
          gh label create rodada-falhou --color D93F0B --description 'A rodada diária falhou' --force >/dev/null
          corpo="A rodada diária falhou em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Se parou antes do passo Publicar a analyze, o que está no ar continua o de antes."
          n=$(gh issue list --label rodada-falhou --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$corpo"
          else gh issue create --title 'Rodada diária falhou' --label rodada-falhou --body "$corpo"; fi
