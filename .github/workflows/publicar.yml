# Publicar: quando um pull request entra na main (um fato conferido, uma mudança de texto ou de código), exporta a
# base, roda os testes e publica a analyze. O push da rodada diária não dispara este (é feito com o GITHUB_TOKEN).
name: Publicar

on:
  push:
    branches: [main]
    paths: ['agente/**', 'dados/**', 'supabase/**', 'estudo/**']
  workflow_dispatch:

concurrency:
  group: analyze-thoran
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # exportar (~5 min) + pytest (~8) + deno (~2), mais a publicação
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      - name: Exportar a base e testar
        run: |
          python -m agente.exportar
          python -m pytest -q --ignore=tests/test_navegador.py
          deno test --allow-read --allow-env supabase/functions/_shared/agente/
      - name: Publicar a analyze no Supabase
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx -y supabase@2.120.0 functions deploy analyze --project-ref ainbuvumkglumwodvdok --no-verify-jwt --use-api
      - name: Guardar a base exportada
        run: |
          git status --porcelain -- supabase/functions/_shared/base.json tests/dados | grep -q . || exit 0
          git config user.name 'publicar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/base.json tests/dados
          git commit -m 'Base exportada depois do merge'
          git pull --rebase
          git push
